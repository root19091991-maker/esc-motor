name: Build OpenIPC ssc30kq ultimate + USB modem (SIM7600)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout OpenIPC firmware
        uses: actions/checkout@v4
        with:
          repository: OpenIPC/firmware
          path: firmware

      - name: Add USB modem drivers (as modules) and uqmi
        working-directory: firmware
        run: |
          set -euo pipefail
          KCFG=br-ext-chip-sigmastar/board/infinity6e/infinity6e-ssc012b.config
          DEFC=br-ext-chip-sigmastar/configs/ssc30kq_ultimate_defconfig
          test -f "$KCFG"; test -f "$DEFC"

          # Kernel is already ~2.07 MB of the 2 MiB the bootloader reads (24 KB headroom),
          # so drivers go in as loadable modules (=m), not into the kernel image.
          setcfg() { sed -i "/^# CONFIG_$1 is not set/d;/^CONFIG_$1=/d" "$KCFG"; echo "CONFIG_$1=$2" >> "$KCFG"; }
          setcfg USB_SERIAL m
          setcfg USB_SERIAL_WWAN m
          setcfg USB_SERIAL_OPTION m
          setcfg USB_ACM m
          setcfg USB_WDM m
          setcfg USB_NET_DRIVERS y
          setcfg USB_USBNET m
          setcfg USB_NET_CDCETHER m
          setcfg USB_NET_QMI_WWAN m
          grep -E "CONFIG_USB_(SERIAL|ACM|WDM|USBNET|NET_)" "$KCFG" || true

          # uqmi: QMI control tool for the modem
          grep -q '^BR2_PACKAGE_UQMI_OPENIPC=y' "$DEFC" || echo 'BR2_PACKAGE_UQMI_OPENIPC=y' >> "$DEFC"

          # load drivers at boot (S35modules reads /etc/modules)
          for m in usbserial usb_wwan option cdc-wdm usbnet cdc_ether qmi_wwan cdc-acm; do
            grep -qx "$m" general/overlay/etc/modules || echo "$m" >> general/overlay/etc/modules
          done
          cat general/overlay/etc/modules

      - name: Build dependencies
        working-directory: firmware
        run: make deps

      - name: Build firmware (ssc30kq ultimate)
        working-directory: firmware
        run: make BOARD=ssc30kq_ultimate

      - name: Verify drivers are in the image
        working-directory: firmware
        run: |
          set -e
          ls -l output/images
          KB=$(find output/build -maxdepth 2 -name .config -path '*linux-*' | head -1)
          echo "kernel config: $KB"
          grep -E "CONFIG_USB_SERIAL_OPTION|CONFIG_USB_NET_QMI_WWAN|CONFIG_USB_SERIAL=" "$KB"
          find output/target/lib/modules -name 'option.ko' -o -name 'usbserial.ko' -o -name 'qmi_wwan.ko' -o -name 'usb_wwan.ko' | sort
          test -n "$(find output/target/lib/modules -name option.ko)" || { echo "option.ko missing: drivers were not built"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: openipc-ssc30kq-ultimate-modem
          path: |
            firmware/output/images/uImage.*
            firmware/output/images/rootfs.squashfs.*
            firmware/output/images/firmware.bin
            firmware/output/images/*.tgz
            firmware/output/images/*.bin
          retention-days: 14
